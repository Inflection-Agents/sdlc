name: SDLC

# The framework's own gates, run on the framework. Every check here is one a
# consuming repo is told to rely on, so if any of them is red HERE, the reference
# is shipping a gate it does not itself pass.
#
# ADR-003 concentrates delivery rigor at one integration gate and re-homes the
# engine's contracts into scripts/sdlc/. That only means anything if something
# actually runs them — before this workflow existed, nothing did.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  # fs.globSync (used by check-review-constraint-globs.mjs) needs 22+.
                  node-version: '22'

            - name: Tests — validators, delivery gates, and the goal leash
              run: node --test scripts/sdlc/*.test.mjs hooks/__tests__/*.test.mjs

            - name: State machine is structurally and referentially valid
              run: node scripts/sdlc/validate-state-machine.mjs

            - name: Generated handoff footers match the state machine
              run: node scripts/sdlc/gen-handoffs.mjs --check

            - name: Phase-memory blocks are valid
              run: node scripts/sdlc/validate-phase-memory.mjs specs/tasks/*/_index.yaml specs/archive/tasks/*/_index.yaml

            - name: Every decomposed spec carries a plan-review block
              # PRESENCE, repo-wide — not approval. A spec mid-decomposition sits at
              # `approved: false` until the owner signs off, so enforcing approval on
              # every PR would redden unrelated PRs and pressure people to flip the flag.
              # Approval is checked per-spec by `spec-execution` §1 before a run starts
              # (ADR-002), which is the moment it actually matters.
              run: node scripts/sdlc/plan-gate.mjs --presence-only specs/tasks/*/_index.yaml specs/archive/tasks/*/_index.yaml

            - name: Constraints registry is well-formed
              run: node scripts/sdlc/validate-constraints-registry.mjs

            - name: Plugin manifest resolves to what is on disk
              # A manifest naming a missing hook installs cleanly and never fires.
              # Same dangling-name class as a registry routing to an agent no repo
              # defines, which is why it is a gate rather than a convention.
              run: node scripts/sdlc/validate-plugin-manifest.mjs

            - name: Archive boundary is correct (no expired spec in the live corpus)
              # Corpus-wide and enforcing. Green because the arming commit arranged the
              # corpus; it goes red when a spec reaches a terminal status and is not moved,
              # or when an archived spec is reopened and not restored.
              run: node scripts/sdlc/archive-specs.mjs --check

            - name: No superseded decision cited as current in always-loaded context
              # Corpus-wide, no `if:` scope. Every other gate here grades changed files,
              # which is exactly how a stale citation survives: the defect sits in a file
              # nobody is editing.
              #
              # Enforcing, but green today because this repo has no WHOLLY superseded ADR.
              # ADR-003 has one row reversed by ADR-004 and is otherwise live authority, and
              # a row-level reversal is deliberately out of scope: no automated check can
              # tell which of an ADR's rows a citation relies on. The FAIL branch is
              # exercised by fixture in check-stale-citations.test.mjs, not by the corpus.
              run: node scripts/sdlc/check-stale-citations.mjs

            - name: Review-constraint globs (warn — this repo's registry is illustrative)
              # Reports, never fails: the shipped rows deliberately match nothing in a
              # docs-only repo. A consuming repo replaces them and switches to
              # `--enforce`, at which point this step can actually go red.
              run: node scripts/sdlc/check-review-constraint-globs.mjs
