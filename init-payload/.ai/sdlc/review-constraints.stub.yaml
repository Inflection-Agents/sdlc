# Review constraints registry — THIS REPO'S OWN INVARIANTS
#
# Ships empty on purpose. `/sdlc:init` fills it from an interview about your
# workspaces, layer boundaries, security surfaces and design surfaces, then proves
# every generated row against your real tree before writing it.
#
# This file lives OUTSIDE the plugin. A plugin's files are overwritten on every
# update, and these are your laws, not the framework's.
#
# Schema per row:
#   id        stable identifier a reviewer cites verbatim
#   scope     task | integration   (task = graded per change; integration = once, at the gate)
#   when      selector — ANY match applies the row:
#               touches:   [glob, ...]   matched against changed paths
#               workspace: [name, ...]   matched against the task's workspace
#   lens      the review lens that enforces it; routed to a reviewer by `agent:`
#   agent     optional; omit to use the generic task-reviewer
#   severity  blocker | major | nit      the floor a violation is graded at
#   check     one line telling the reviewer exactly what to verify
#   cite      grounding prefix a finding must carry (inv: | std: | adr: | ac: | lens: ...)
#
# Example, for shape only — delete it:
#
#   - id: INV-CORE-PURITY
#     scope: task
#     when: { touches: ["packages/shared/src/core/**"] }
#     lens: core-purity
#     severity: blocker
#     check: >
#       The pure core imports no I/O, platform or framework API and contains no side
#       effects. Effects are described as data and performed at the edges.
#     cite: "inv:INV-CORE-PURITY"

constraints: []
